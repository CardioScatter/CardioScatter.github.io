<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#10264f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f97316"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .math { font-family: Georgia, 'Times New Roman', serif; fill: #111827; font-style: italic; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 600; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #111827; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111827; }
      .box { fill: #ffffff; stroke-width: 2.4; rx: 13; }
      .flow { fill: none; stroke: #10264f; stroke-width: 4; marker-end: url(#arrow); }
      .thin-flow { fill: none; stroke: #10264f; stroke-width: 3; marker-end: url(#arrow); }
      .axis { fill: none; stroke: #111827; stroke-width: 2; }
    </style>
  </defs>

  <rect width="2000" height="1000" fill="#ffffff"/>

  <!-- Group boundaries -->
  <rect x="250" y="24" width="760" height="340" rx="24" fill="#eff6ff" fill-opacity="0.32" stroke="#2563eb" stroke-width="2.6" stroke-dasharray="10 8"/>
  <rect x="1040" y="24" width="700" height="340" rx="24" fill="#f0fdf4" fill-opacity="0.34" stroke="#16803b" stroke-width="2.6" stroke-dasharray="10 8"/>
  <rect x="180" y="430" width="1560" height="500" rx="26" fill="#fff7ed" fill-opacity="0.34" stroke="#f97316" stroke-width="2.6" stroke-dasharray="10 8"/>

  <!-- Input antenna and waveform -->
  <g transform="translate(20 130)">
    <path d="M34 155 L34 35 M15 155 H53 M20 155 L34 76 L48 155 M22 119 H46 M25 97 H43" fill="none" stroke="#111827" stroke-width="5"/>
    <path d="M14 55 Q-2 72 14 89 M2 43 Q-22 72 2 101 M54 55 Q70 72 54 89 M66 43 Q90 72 66 101" fill="none" stroke="#111827" stroke-width="4"/>
    <text x="132" y="10" class="label" text-anchor="middle" fill="#312e81">Backscattered</text>
    <text x="132" y="36" class="label" text-anchor="middle" fill="#312e81">RF Signal</text>
    <path d="M65 108 L74 99 L83 119 L92 84 L101 128 L110 72 L119 135 L128 95 L137 116 L146 64 L155 140 L164 87 L173 122 L182 101 L191 112 L200 74 L209 132 L218 91 L227 114" fill="none" stroke="#7c3aed" stroke-width="2.7"/>
  </g>
  <path d="M215 285 H270" class="flow"/>

  <!-- Signal acquisition title -->
  <text x="630" y="62" class="title" text-anchor="middle" fill="#2563eb">Signal Acquisition</text>

  <!-- Raw low-IF spectrum -->
  <g transform="translate(370 78)">
    <path d="M0 92 V0 M0 92 H590" class="axis"/>
    <!-- Three separated tag-specific carrier clusters; each cluster may contain
         a dominant carrier and weaker neighboring components. -->
    <path d="M14 91
             C43 91 53 90 62 87 C69 83 73 72 78 66 C84 76 88 85 96 88
             C101 83 105 47 112 11 C119 49 124 82 132 88
             C140 86 145 74 150 67 C156 78 161 87 170 90 C188 91 205 91 220 91
             C238 91 246 89 252 84 C258 79 262 67 267 61 C273 73 278 84 286 88
             C291 82 295 46 302 10 C309 47 314 82 322 88
             C330 85 335 74 340 67 C346 78 351 87 360 90 C379 91 397 91 419 91
             C438 91 446 89 452 84 C458 79 462 67 467 62 C473 73 478 84 486 88
             C491 82 495 48 502 12 C509 49 514 82 522 88
             C530 85 535 74 540 68 C546 78 551 87 560 90 C568 91 574 91 579 91"
          fill="#7c3aed" fill-opacity="0.20" stroke="#6d28d9" stroke-width="2.2"/>
    <text x="112" y="104" class="math" font-size="19" text-anchor="middle">f<tspan baseline-shift="sub" font-size="13">IF,1</tspan></text>
    <text x="302" y="104" class="math" font-size="19" text-anchor="middle">f<tspan baseline-shift="sub" font-size="13">IF,2</tspan></text>
    <text x="402" y="56" class="sans" font-size="24">⋯</text>
    <text x="502" y="104" class="math" font-size="19" text-anchor="middle">f<tspan baseline-shift="sub" font-size="13">IF,K</tspan></text>
    <text x="602" y="100" class="math" font-size="20">f</text>
  </g>

  <!-- Acquisition blocks -->
  <rect x="280" y="245" width="175" height="82" class="box" stroke="#2563eb"/>
  <text x="368" y="278" class="label" text-anchor="middle">Down-conversion</text>
  <text x="368" y="306" class="label" text-anchor="middle">to IF</text>
  <rect x="500" y="245" width="105" height="82" class="box" stroke="#2563eb"/>
  <text x="553" y="294" class="label" text-anchor="middle">ADC</text>
  <path d="M455 286 H500" class="thin-flow"/>

  <!-- ADC fork and FFT detection path -->
  <circle cx="635" cy="286" r="5" fill="#10264f"/>
  <path d="M605 286 H635" fill="none" stroke="#10264f" stroke-width="4"/>
  <text x="650" y="314" class="small">Digitized low-IF I/Q</text>
  <path d="M635 286 V239 H690" class="thin-flow"/>
  <rect x="690" y="200" width="260" height="78" class="box" stroke="#2563eb"/>
  <text x="820" y="231" class="label" text-anchor="middle">N-sample Framing and</text>
  <text x="820" y="259" class="label" text-anchor="middle">N-point FFT</text>

  <!-- Multi-tag title and detected spectrum -->
  <text x="1390" y="62" class="title" text-anchor="middle" fill="#16803b">Multi-Tag Channelization</text>
  <g transform="translate(1090 84)">
    <path d="M0 92 V0 M0 92 H600" class="axis"/>
    <rect x="42" y="17" width="112" height="75" rx="16" fill="#dbeafe" fill-opacity="0.45" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="236" y="17" width="112" height="75" rx="16" fill="#dcfce7" fill-opacity="0.45" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="445" y="17" width="112" height="75" rx="16" fill="#ffedd5" fill-opacity="0.55" stroke="#f97316" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M48 91 C69 91 81 88 89 79 C95 68 97 36 101 19 C105 39 108 72 116 81 C125 88 137 91 148 91" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2.3"/>
    <path d="M242 91 C263 91 275 88 283 79 C289 68 291 36 295 19 C299 39 302 72 310 81 C319 88 331 91 342 91" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="2.3"/>
    <path d="M451 91 C472 91 484 88 492 79 C498 68 500 36 504 19 C508 39 511 72 519 81 C528 88 540 91 551 91" fill="#f97316" fill-opacity="0.35" stroke="#f97316" stroke-width="2.3"/>
    <text x="101" y="12" class="math" font-size="19" text-anchor="middle">f<tspan baseline-shift="sub" font-size="13">IF,1</tspan></text>
    <text x="295" y="12" class="math" font-size="19" text-anchor="middle">f<tspan baseline-shift="sub" font-size="13">IF,2</tspan></text>
    <text x="395" y="58" class="sans" font-size="24">⋯</text>
    <text x="504" y="12" class="math" font-size="19" text-anchor="middle">f<tspan baseline-shift="sub" font-size="13">IF,K</tspan></text>
    <text x="612" y="100" class="math" font-size="20">f</text>
  </g>

  <!-- Detection and channel filter bank -->
  <path d="M950 239 H1080" class="thin-flow"/>
  <rect x="1080" y="200" width="190" height="78" class="box" stroke="#16803b"/>
  <text x="1175" y="231" class="label" text-anchor="middle">Tag-Band</text>
  <text x="1175" y="259" class="label" text-anchor="middle">Detection</text>
  <rect x="1450" y="225" width="205" height="108" class="box" stroke="#16803b"/>
  <text x="1553" y="258" class="label" text-anchor="middle">Per-Tag Digital</text>
  <text x="1553" y="286" class="label" text-anchor="middle">Filter Bank</text>
  <text x="1553" y="313" class="small" text-anchor="middle">independent channel streams</text>
  <!-- Raw I/Q data bypass -->
  <path d="M635 286 H1450" class="flow"/>
  <!-- Detection control path -->
  <path d="M1270 239 H1390 V244 H1450" fill="none" stroke="#16803b" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>
  <text x="1360" y="226" class="small" text-anchor="middle" fill="#166534">detected tag bands</text>

  <!-- Single unambiguous bus from filter bank to per-tag pipeline -->
  <path d="M1655 279 H1760 V405 H215 V575 H235" class="flow"/>
  <rect x="845" y="386" width="305" height="38" rx="18" fill="#ffffff" stroke="#10264f" stroke-width="1.8"/>
  <text x="998" y="412" class="math" font-size="20" text-anchor="middle">z<tspan baseline-shift="sub" font-size="14">i</tspan>[n],  i = 1, …, K</text>

  <!-- Per-tag ECG recovery -->
  <text x="960" y="474" class="title" text-anchor="middle" fill="#ea580c">Per-Tag ECG Recovery</text>
  <text x="960" y="504" class="small" text-anchor="middle" fill="#9a3412">applied independently to each tag channel, i = 1, …, K</text>

  <rect x="235" y="535" width="210" height="82" class="box" stroke="#f97316"/>
  <text x="340" y="568" class="label" text-anchor="middle">CFO Estimation</text>
  <text x="340" y="596" class="label" text-anchor="middle">and Compensation</text>
  <rect x="480" y="535" width="160" height="82" class="box" stroke="#f97316"/>
  <text x="560" y="568" class="label" text-anchor="middle">FM</text>
  <text x="560" y="596" class="label" text-anchor="middle">Demodulation</text>
  <path d="M445 576 H480" class="thin-flow"/>

  <!-- fdev waveform -->
  <g transform="translate(675 526)">
    <rect x="0" y="0" width="155" height="100" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M8 69 C17 69 20 62 26 62 C33 62 36 69 45 69 H51 L56 65 L60 68 L65 27 L70 84 L75 66 L84 69 H94 C101 69 106 55 114 55 C123 55 130 69 144 69" fill="none" stroke="#10264f" stroke-width="2.6"/>
    <text x="78" y="20" class="math" font-size="18" text-anchor="middle">f<tspan baseline-shift="sub" font-size="13">dev,i</tspan>[n]  [Hz]</text>
  </g>
  <path d="M640 576 H675" class="thin-flow"/>

  <!-- Linear conversion block -->
  <rect x="865" y="510" width="300" height="380" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="2.8"/>
  <text x="1015" y="544" class="label" text-anchor="middle">Tag-Specific Linear</text>
  <text x="1015" y="572" class="label" text-anchor="middle">Frequency-to-Voltage</text>
  <text x="1015" y="600" class="label" text-anchor="middle">Conversion</text>
  <text x="1015" y="638" class="math" font-size="22" text-anchor="middle">v̂<tspan baseline-shift="sub" font-size="14">ECG,i</tspan>[n] = f<tspan baseline-shift="sub" font-size="14">dev,i</tspan>[n] / κ<tspan baseline-shift="sub" font-size="14">i</tspan></text>
  <text x="1015" y="668" class="tiny" text-anchor="middle">κ<tspan baseline-shift="sub" font-size="11">i</tspan>: signed sensitivity</text>
  <text x="1015" y="689" class="tiny" text-anchor="middle">from per-tag calibration</text>
  <!-- Bipolar calibration axes -->
  <path d="M903 790 H1125" class="axis" marker-end="url(#arrow)"/>
  <path d="M1014 856 V710" class="axis" marker-end="url(#arrow)"/>
  <path d="M921 843 L1105 733" fill="none" stroke="#f97316" stroke-width="3.2"/>
  <circle cx="1014" cy="790" r="4.5" fill="#111827"/>
  <text x="1122" y="811" class="tiny">+</text><text x="903" y="811" class="tiny">−</text>
  <text x="1025" y="722" class="tiny">+</text><text x="1025" y="854" class="tiny">−</text>
  <text x="1014" y="877" class="tiny" text-anchor="middle">Frequency Deviation (Hz)</text>
  <text x="886" y="790" class="tiny" text-anchor="middle" transform="rotate(-90 886 790)">ECG Voltage (mV)</text>
  <path d="M830 576 H865" class="thin-flow"/>

  <!-- Converted voltage waveform -->
  <g transform="translate(1200 526)">
    <rect x="0" y="0" width="155" height="100" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M8 69 C17 69 20 62 26 62 C33 62 36 69 45 69 H51 L56 65 L60 68 L65 27 L70 84 L75 66 L84 69 H94 C101 69 106 55 114 55 C123 55 130 69 144 69" fill="none" stroke="#10264f" stroke-width="2.6"/>
    <text x="78" y="20" class="math" font-size="18" text-anchor="middle">v̂<tspan baseline-shift="sub" font-size="13">ECG,i</tspan>[n]  [mV]</text>
  </g>
  <path d="M1165 576 H1200" class="thin-flow"/>

  <rect x="1390" y="535" width="205" height="82" class="box" stroke="#f97316"/>
  <text x="1493" y="568" class="label" text-anchor="middle">Resampling to ECG</text>
  <text x="1493" y="596" class="label" text-anchor="middle">Sampling Rate</text>
  <path d="M1355 576 H1390" class="thin-flow"/>
  <rect x="1630" y="535" width="125" height="82" class="box" stroke="#f97316"/>
  <text x="1693" y="568" class="label" text-anchor="middle">ECG</text>
  <text x="1693" y="596" class="label" text-anchor="middle">Filtering</text>
  <path d="M1595 576 H1630" class="thin-flow"/>

  <!-- Clean output fan-out -->
  <path d="M1755 576 H1790" fill="none" stroke="#10264f" stroke-width="4"/>
  <circle cx="1790" cy="576" r="5" fill="#10264f"/>
  <path d="M1790 576 V545 H1820" fill="none" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <path d="M1790 576 V650 H1820" fill="none" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  <path d="M1790 576 V755 H1820" fill="none" stroke="#f97316" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
  <text x="1900" y="478" class="label" text-anchor="middle" fill="#312e81">Recovered ECG</text>
  <text x="1900" y="504" class="label" text-anchor="middle" fill="#312e81">Waveforms</text>

  <g transform="translate(1825 520)">
    <path d="M0 25 H16 L21 20 L26 24 L31 0 L36 45 L41 23 L50 25 H100" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="112" y="31" class="label" fill="#2563eb">ECG 1</text>
  </g>
  <g transform="translate(1825 625)">
    <path d="M0 25 H16 L21 20 L26 24 L31 0 L36 45 L41 23 L50 25 H100" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <text x="112" y="31" class="label" fill="#16a34a">ECG 2</text>
  </g>
  <text x="1878" y="704" class="sans" font-size="27" text-anchor="middle">⋮</text>
  <g transform="translate(1825 730)">
    <path d="M0 25 H16 L21 20 L26 24 L31 0 L36 45 L41 23 L50 25 H100" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <text x="112" y="31" class="label" fill="#f97316">ECG K</text>
  </g>
</svg>
